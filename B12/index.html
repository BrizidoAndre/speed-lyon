<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Blur effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container-blur {
            margin: 0 auto;
            position: relative;
            width: clamp(200px, 50%, 800px);
        }

        .img-total {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
        }

        .blur-effect {
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            border-right: 1rem solid red;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container-blur">
    <img src="Fluffy-Frenchies-for-sale-61.jpg" alt="Fluffly french bulldog" class="img-total">
    <div class="blur-effect"></div>
</div>
<script>
    const containerDiv = document.querySelector('.container-blur');
    const blurDiv = document.querySelector('.blur-effect');

    let isDragging = false;
    blurDiv.addEventListener('mousedown', () => {
        isDragging = true;

    })
    window.addEventListener('mouseup', notDraggin)

    function notDraggin() {
        isDragging = false;
    }

    window.addEventListener('mousemove', (ev) => {
        if (isDragging) {
            blurDiv.style.width = Math.min((ev.x - containerDiv.offsetLeft + 8), containerDiv.offsetWidth) + 'px';
        }
    })
</script>
</body>
</html>
