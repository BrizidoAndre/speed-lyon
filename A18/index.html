<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container-wrapper">
    <div class="container-input">
        <input checked type="radio" name="slide" id="first" autofocus>
        <input type="radio" name="slide" id="second">
        <input type="radio" name="slide" id="third">
    </div>
    <label for="first" class="slide-click"></label>
    <div class="slide-wrapper">
        <div class="slide-container">
            <img src="images/1.jpg" alt="First image">
        </div>
        <div class="slide-container">
            <img src="images/2.jpg" alt="Second image">
        </div>
        <div class="slide-container">
            <img src="images/3.jpg" alt="Third image">
        </div>
    </div>
</div>
</body>
</html>
