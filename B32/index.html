<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tail animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
            cursor: none;
        }

        canvas {
            width: 100vw;
            height: 100vh;
        }

        #cursor {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 20px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: red;
            transition: width .4s, height .4s;
        }
    </style>
</head>
<body>
<div id="cursor">

</div>
<canvas id="canvas"></canvas>
<script>
    const cursor = document.getElementById('cursor');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tail = [];
    let resizeCursorId;

    function moveCursor(ev) {
        let {x, y} = ev;
        // update cursor immediately
        cursor.style.top = y + 'px';
        cursor.style.left = x + 'px';

        // creating an object so we can reference it later it
        const tailObject = {
            x,
            y
        }
        // add properties to tail array
        tail.push(tailObject)
        // after half a second the tail is cleared
        setTimeout(() => {
            const id = tail.indexOf(tailObject);
            tail.splice(id, 1);
        }, 500)
        cursor.style.width = '10px';
        clearTimeout(resizeCursorId);
        resizeCursorId = setTimeout(() => {
            cursor.style.width = '20px';
        }, 1000)
    }

    function renderTail() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath()
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'red';
        tail.forEach(position => {
            ctx.lineTo(position.x, position.y);
        })
        ctx.stroke();
        requestAnimationFrame(renderTail);
    }

    renderTail()

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    resize()

    window.addEventListener('mousemove', moveCursor)
    window.addEventListener('resize', resize)
</script>
</body>
</html>
