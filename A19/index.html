<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ddd;
        }

        .flag {
            display: flex;
            position: relative;
            margin-bottom: 200px;
            transform: rotate(-20deg);
        }

        .flag .item {
            width: 255px;
            height: 170px;
        }

        .flag:before {
            content: "";
            position: absolute;
            right: 100%;
            top: 0;
            width: 4px;
            height: 300px;
            background: black;
        }

        .website-svg {
            width: 300px;
            aspect-ratio: 1;
            rotate: -20deg;
        }
    </style>
</head>
<body>
<svg width="600" height="400" viewBox="0 0 600 400" style="background: #f0f0f0;">
    <defs>
        <linearGradient id="flagMask">
            <stop offset="0%" stop-color="black"/>
            <stop offset="20%" stop-color="black"/>
            <stop offset="100%" stop-color="white"/>
        </linearGradient>

        <filter id="verticalFlap" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.005 0.05"
                    numOctaves="2"
                    result="noise">
                <animate
                        attributeName="seed"
                        from="1" to="100"
                        dur="10s"
                        repeatCount="indefinite"/>
            </feTurbulence>

            <feFlood flood-color="white" result="whiteCanvas"/>
            <feImage href="#flagMask" result="grad" x="0" y="0" width="600" height="400"/>
            <feComposite in="noise" in2="grad" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="maskedNoise"/>

            <feDisplacementMap
                    in="SourceGraphic"
                    in2="maskedNoise"
                    scale="80"
                    xChannelSelector="R"
                    yChannelSelector="G"/>
        </filter>
    </defs>

    <image
            href="flag.png"
            width="100%"
            height="100%"
            filter="url(#verticalFlap)"
            preserveAspectRatio="xMidYMid slice"/>
</svg>
</body>
</html>
