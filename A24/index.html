<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        :root {
            --spacing: 2rem;
            --animation-duration: 2s;
            --animation-delay: 0s;
            --position-margin: 15%;
            --length: 30px;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            perspective: 1000px;
        }

        .box {
            position: relative;
            width: 300px;
            height: 300px;
            aspect-ratio: 1;
            transform-style: preserve-3d;
        }

        .line {
            position: absolute;
            width: 100%;
            height: var(--length);
            transform-style: preserve-3d;
        }

        .line {
            animation: rotate var(--animation-duration) infinite ease-out var(--animation-delay);
        }

        @keyframes rotate {
            from {
                rotate: 0deg;
            }
            to {
                rotate: 270deg;
            }
        }

        .line-1 {
            transform-origin: calc(100% - (var(--position-margin) + var(--length) / 2)) 50%;
            top: var(--position-margin);
        }

        .line-2, .line-4 {
            width: var(--length);
            height: 100%;
        }

        .line-2 {
            transform-origin: 50% calc(100% - (var(--position-margin) + var(--length) / 2));
            right: var(--position-margin);
        }

        .line-3 {
            transform-origin: calc(var(--length) / 2 + var(--position-margin)) 50%;
            bottom: var(--position-margin);
        }

        .line-4 {
            transform-origin: 50% calc(var(--length) / 2 + var(--position-margin));
            left: var(--position-margin);
        }

        .bar {
            width: 100%;
            height: 100%;
            outline: .5rem solid white;
            background: #333;
        }

        @keyframes angle {
            from {
                --angle: -2deg
            }
            to {
                --angle: 2deg
            }
        }

        .line .bar {
            animation: angle var(--animation-duration) infinite steps(2, jump-none) var(--animation-delay);
        }

        .line-1 .bar {
            transform: rotateY(calc(var(--angle) * -1));
        }

        .line-2 .bar {
            transform: rotateX(var(--angle));
        }

        .line-3 .bar {
            transform: rotateY(var(--angle));
        }

        .line-4 .bar {
            transform: rotateX(calc(var(--angle) * -1));
        }
    </style>
</head>
<body>
<div class="box">
    <div class="line line-1">
        <div class="bar"></div>
    </div>
    <div class="line line-2">
        <div class="bar"></div>
    </div>
    <div class="line line-3">
        <div class="bar"></div>
    </div>
    <div class="line line-4">
        <div class="bar"></div>
    </div>
</div>
</body>
</html>
