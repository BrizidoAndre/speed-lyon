<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Video share</title>
    <style>
        .container {
            width: 90%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin: 0 auto;
        }

        video {
            aspect-ratio: 16/9;
            -webkit-border-radius: .5rem;
            -moz-border-radius: .5rem;
            border-radius: .5rem;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="video/video1.mp4">
        <video src="./video/video1.mp4"></video>
    </a>
    <a href="video/video2.mp4">
        <video src="./video/video2.mp4"></video>
    </a>
    <a href="video/video3.mp4">
        <video src="./video/video3.mp4"></video>
    </a>
    <a href="video/video4.mp4">
        <video src="./video/video4.mp4"></video>
    </a>
    <a href="video/video5.mp4">
        <video src="./video/video5.mp4"></video>
    </a>
    <a href="video/video6.mp4">
        <video src="./video/video6.mp4"></video>
    </a>
    <a href="video/video7.mp4">
        <video src="./video/video7.mp4"></video>
    </a>
    <a href="video/video8.mp4">
        <video src="./video/video8.mp4"></video>
    </a>
</div>
</body>
</html>
