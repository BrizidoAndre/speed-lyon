<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Holy Grail</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            grid-template:
            "h h h" 50px
            "l m r" 1fr
            "f f f" 50px;
        }

        header, aside, main, footer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bolder;
            padding-top: 1rem;
        }

        header {
            background: orangered;
            grid-area: h;
        }

        aside.left {
            background: deepskyblue;
            grid-area: l;
        }

        aside.right {
            background: green;
            grid-area: r;
        }

        main {
            background: darkslateblue;
            grid-area: m;
        }

        footer {
            background: deeppink;
            grid-area: f;
        }


        @media (max-width: 1100px) {
            body {
                grid-template:
                "h" 40px
                "m" minmax(500px, 1fr)
                "l" minmax(60px, auto)
                "r" minmax(60px, auto)
                "f" 40px;
            }
        }

    </style>
</head>
<body>
<header>
    <p>HEADER</p>
</header>
<aside class="left">
    <p>LEFT SIDEBAR</p>
</aside>
<main>
    <p>MAIN CONTENT</p>
</main>
<aside class="right">
    <p>RIGHT SIDEBAR</p>
</aside>
<footer>
    <p>FOOTER</p>
</footer>
</body>
</html>
